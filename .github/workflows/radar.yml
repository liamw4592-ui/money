name: 赚钱雷达
on:
  schedule:
    - cron: "0 0 * * *"   # 每天北京时间 08:00
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/monitor.py > /dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: 提交报告
        run: |
          git config user.name "money-radar"; git config user.email "bot@users.noreply.github.com"
          git add reports && git commit -m "report $(date +%F)" || echo "no change"
          git push
      - name: 推送为 Issue(GitHub 会发邮件/手机通知)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "赚钱雷达 $(date +%F)" --body-file reports/latest.md
